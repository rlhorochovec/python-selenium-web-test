name: Testes com Python e Selenium
'on':
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

jobs:
  python-run:
    name: Executar testes com Python e Selenium
    runs-on: ubuntu-latest
    steps:
      - name: Copiar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar testes com relatório HTML
        run: |
          behave -f html -o reports/relatorio_testes.html

      - name: Salvar relatório e evidências como artefatos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-e-evidencias
          path: |
            reports/relatorio_testes.html
            reports/screenshots/

      - name: Deploy Behave Report
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: '${{ secrets.GITHUB_TOKEN }}'
          publish_dir: ./reports
          publish_branch: gh-pages
          keep_files: true
